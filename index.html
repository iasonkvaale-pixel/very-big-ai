<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Min første AI-nettside</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    
    <!-- Venstre side: Robot -->
    <div class="robot-panel">
      <img src="bilder/robot.png" alt="Min AI-robot" class="robot-image">
      <h2>AI-robot 🤖</h2>

      <!-- INFO-DEL -->
      <p class="info-text">
        Dette er min første AI-nettside.<br>
        Roboten er ikke ekte AI –<br>
        men den følger regler jeg har laget selv.
      </p>
    </div>

    <!-- Høyre side: Chat -->
    <div class="chat-panel">
      <h1>Chat med roboten</h1>

       <div class="chat-window" id="messages">
        <p id="chatbot" class="bot-message">
          Hei! Jeg er roboten din 🤖
        </p>
      </div>

      <div class="chat-input">
        <input id="input" placeholder="Skriv noe her..." />
        <button id="send">Send</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
