<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERY BIG AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Venstre side -->
    <div class="robot-panel">
      <img src="bilder/robot.png" alt="tis very big" class="robot-image">
      <h2>VERY GOOD AI</h2>

      <p class="info-text">
        You can get rich by just being active on this web for hours<br>
        Very good AI –<br>
        No scam bro
      </p>
    </div>

    <!-- Høyre side -->
    <div class="chat-panel">
      <h1>VERY BIG AI</h1>

      <div class="chat-window" id="messages">
        <p class="bot-message">:P</p>
      </div>

      <div class="chat-input">
        <input id="input" type="text" placeholder="what would you like today??" />
        <button id="send">Send</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
